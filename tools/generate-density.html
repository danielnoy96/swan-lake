<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swan Pond Density Generator</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    body { max-width: 880px; margin: 0 auto; padding: 32px 20px; background: #080808; color: #eee; }
    h1 { font: 600 28px/1.2 system-ui, sans-serif; }
    p { line-height: 1.5; color: #bbb; }
    button, a.download { display: inline-block; margin: 4px 8px 4px 0; padding: 10px 14px; border: 1px solid #777; border-radius: 6px; background: #181818; color: #fff; text-decoration: none; cursor: pointer; }
    button:disabled, a.download[aria-disabled="true"] { opacity: .4; pointer-events: none; }
    progress { width: 100%; height: 18px; margin: 16px 0; }
    pre { min-height: 220px; padding: 16px; overflow: auto; border: 1px solid #333; background: #111; white-space: pre-wrap; }
    canvas { display: none !important; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="../core.js"></script>
  <script src="../sampler.js"></script>
  <script src="../density-codec.js"></script>
</head>
<body>
  <h1>Density data generator</h1>
  <p>Serve the repository over HTTP. Generate recomputes every PNG through the production source sampler, validates the SWD round trip, and enables one download per act. Copy the four files into <code>assets/density/</code>.</p>
  <button id="generate" disabled>Generate and validate</button>
  <button id="verify" disabled>Verify committed files against PNGs</button>
  <div id="downloads"></div>
  <progress id="progress" max="692" value="0"></progress>
  <pre id="log">Initializing p5…</pre>
  <script src="generate-density.js"></script>
</body>
</html>
